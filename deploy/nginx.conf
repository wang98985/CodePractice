server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许批量导入题目时上传较大的 CSV
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端 API（含 AI 助理 SSE 流式接口）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # SSE 必须关闭缓冲，否则流式回复会被攒着一次性返回
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django 后台（改到 /django-admin/，避免与前端 SPA 的 /admin/* 路由冲突）
    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django 后台静态资源（由 WhiteNoise 提供）
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 前端静态资源（文件名带内容哈希，可长期缓存，避免每次访问重下导致加载慢）
    location /assets/ {
        expires 30d;
    }

    # 前端 SPA 路由（index.html 不缓存，避免缓存的旧壳引用失效 chunk 导致白屏）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}